{% load static tailwind_tags %}
<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Employee Dashboard{% endblock %}</title>
    {% tailwind_css %}
</head>
<body class="flex flex-col h-full text-slate-800">

    <header class="bg-white border-b border-slate-200 sticky top-0 z-40 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16 gap-4">
                
                <div class="flex-shrink-0">
                    <a href="#" class="text-xl font-bold tracking-tight bg-gradient-to-r from-blue-600 to-indigo-600 bg-clip-text text-transparent">
                       Lingara Sanitary
                    </a>
                </div>  

                <div class="flex-1 max-w-md mx-4 hidden md:block">
                    <form action="#" method="GET" class="relative">
                        <div class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-3">
                            <svg class="h-5 w-5 text-slate-400" viewBox="0 0 20 20" fill="currentColor">
                                <path fill-rule="evenodd" d="M9 3.5a5.5 5.5 0 100 11 5.5 5.5 0 000-11zM2 9a7 7 0 1112.452 4.391l3.328 3.329a.75.75 0 11-1.06 1.06l-3.329-3.328A7 7 0 012 9z" clip-rule="evenodd" />
                            </svg>
                        </div>
                        <input type="search" name="q" placeholder="Search products, orders, bills..." 
                               class="block w-full rounded-lg border-0 py-1.5 pl-10 pr-3 text-slate-900 bg-slate-100 placeholder:text-slate-400 focus:bg-white focus:ring-2 focus:ring-inset focus:ring-indigo-600 sm:text-sm sm:leading-6 transition duration-150 ease-in-out">
                    </form>
                </div>

                <nav class="hidden md:flex items-center space-x-4">
                    <a href="#" class="text-sm font-medium text-slate-600 hover:text-indigo-600 px-3 py-2 rounded-md hover:bg-slate-50 transition">Products</a>
                    <a href="#" class="text-sm font-medium text-slate-600 hover:text-indigo-600 px-3 py-2 rounded-md hover:bg-slate-50 transition">Billing</a>
                    <a href="#" class="text-sm font-medium text-slate-600 hover:text-indigo-600 px-3 py-2 rounded-md hover:bg-slate-50 transition">Return</a>
                    <span class="text-slate-300">|</span>
                    <a href="{% url 'owner_home' %}" class="text-sm font-semibold text-indigo-600 hover:text-indigo-700 px-3 py-2 rounded-md hover:bg-indigo-50 transition">Owner</a>
                </nav>

                <div class="flex items-center md:hidden">
                    <button id="menu-btn" type="button" class="inline-flex items-center justify-center p-2 rounded-md text-slate-500 hover:text-slate-600 hover:bg-slate-100 focus:outline-none focus:ring-2 focus:ring-inset focus:ring-indigo-500">
                        <span class="sr-only">Open main menu</span>
                        <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5" />
                        </svg>
                    </button>
                </div>

            </div>
        </div>
    </header>

    <div id="mobile-menu" class="relative z-50 hidden" role="dialog" aria-modal="true">
        <div id="menu-backdrop" class="fixed inset-0 bg-slate-900/30 backdrop-blur-sm opacity-0 transition-opacity duration-300 ease-linear"></div>

        <div class="fixed inset-0 flex justify-end">
            <div id="menu-panel" class="relative w-full max-w-xs bg-white h-full shadow-xl p-6 flex flex-col justify-between transform translate-x-full transition-transform duration-300 ease-in-out">
                
                <div>
                    <div class="flex items-center justify-between mb-8">
                        <span class="text-lg font-bold bg-gradient-to-r from-blue-600 to-indigo-600 bg-clip-text text-transparent">Menu</span>
                        <button id="close-btn" type="button" class="rounded-md p-1.5 text-slate-500 hover:bg-slate-100">
                            <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
                            </svg>
                        </button>
                    </div>

                    <nav class="space-y-3">
                        <a href="#" class="block text-base font-medium text-slate-700 hover:text-indigo-600 hover:bg-slate-50 px-3 py-2.5 rounded-lg transition">Products</a>
                        <a href="#" class="block text-base font-medium text-slate-700 hover:text-indigo-600 hover:bg-slate-50 px-3 py-2.5 rounded-lg transition">Billing</a>
                        <a href="#" class="block text-base font-medium text-slate-700 hover:text-indigo-600 hover:bg-slate-50 px-3 py-2.5 rounded-lg transition">Return</a>
                        <hr class="border-slate-100 my-2">
                        <a href="{% url 'owner_home' %}" class="block text-base font-semibold text-indigo-600 hover:bg-indigo-50 px-3 py-2.5 rounded-lg transition">Owner</a>
                    </nav>
                </div>
 
                <div class="mt-auto pt-6 border-t border-slate-100">
                    <form action="#" method="GET" class="relative">
                        <div class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-3">
                            <svg class="h-4 w-4 text-slate-400" viewBox="0 0 20 20" fill="currentColor">
                                <path fill-rule="evenodd" d="M9 3.5a5.5 5.5 0 100 11 5.5 5.5 0 000-11zM2 9a7 7 0 1112.452 4.391l3.328 3.329a.75.75 0 11-1.06 1.06l-3.329-3.328A7 7 0 012 9z" clip-rule="evenodd" />
                            </svg>
                        </div>
                        <input type="search" name="q" placeholder="Search..." 
                               class="block w-full rounded-lg border-0 py-2 pl-9 pr-3 text-slate-900 bg-slate-100 placeholder:text-slate-400 focus:bg-white focus:ring-2 focus:ring-indigo-600 text-sm transition">
                    </form>
                </div>

            </div>
        </div>
    </div>

    <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
        {% block content %}
        {% endblock %}
    </main>

    <footer class="bg-white border-t border-slate-200 mt-auto">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex flex-col sm:flex-row items-center justify-between gap-2">
            <p class="text-sm text-slate-500">&copy; 2026 Lingaraj Sanitary. All rights reserved.</p>
            <div class="flex space-x-4 text-xs text-slate-400">
                <a href="#" class="hover:text-slate-600">Developed by Debasish Dash.</a>
            </div>
        </div>
    </footer>

    <script>
        const menuBtn = document.getElementById('menu-btn');
        const closeBtn = document.getElementById('close-btn');
        const mobileMenu = document.getElementById('mobile-menu');
        const menuBackdrop = document.getElementById('menu-backdrop');
        const menuPanel = document.getElementById('menu-panel');

        function openMenu() {
            mobileMenu.classList.remove('hidden');
            // Allow browser layout engine to register the change, then apply transitions
            setTimeout(() => {
                menuBackdrop.classList.remove('opacity-0');
                menuPanel.classList.remove('translate-x-full');
            }, 20);
        }

        function closeMenu() {
            menuBackdrop.classList.add('opacity-0');
            menuPanel.classList.add('translate-x-full');
            // Hide parent shell completely once animation finishes
            setTimeout(() => {
                mobileMenu.classList.add('hidden');
            }, 300); 
        }

        menuBtn.addEventListener('click', openMenu);
        closeBtn.addEventListener('click', closeMenu);
        menuBackdrop.addEventListener('click', closeMenu);
    </script>

</body>
</html>
